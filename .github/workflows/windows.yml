# Compila o BruMaRe para Windows e publica uma Release completa no GitHub:
#   - BruMaRe-Setup-<versão>.exe            instalador (recomendado)
#   - BruMaRe-Portable-<versão>-win64.zip   versão portátil (BruMaRe.exe + brumare-cli.exe)
#   - BruMaRe.exe / brumare-cli.exe         interface gráfica e linha de comando soltos
#   - SHA256SUMS.txt                        checksums para verificação
#
# COMO USAR (sem terminal):
#   Actions > "Windows (.exe e instalador)" > Run workflow > informe a versão (ex.: 1.0.2).
#   O workflow cria a tag v<versão> e a Release automaticamente.
#
# Também continua funcionando ao enviar uma tag "v*" (git tag v1.0.2 && git push origin v1.0.2).
name: Windows (.exe e instalador)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do programa (ex.: 1.0.2). A tag v<versão> será criada."
        required: true
        default: "1.0.1"
      publicar:
        description: "Publicar na aba Releases do GitHub?"
        type: boolean
        required: false
        default: true
      prerelease:
        description: "Marcar como pré-release (beta)?"
        type: boolean
        required: false
        default: false
      rascunho:
        description: "Criar como rascunho (você revisa e publica depois)?"
        type: boolean
        required: false
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # ------------------------------------------------------------------
      # Versão: vem do campo digitado no "Run workflow" ou da tag vX.Y.Z.
      # É gravada em VERSAO (só no build), então o .exe, o instalador e a
      # Release sempre mostram o mesmo número.
      # ------------------------------------------------------------------
      - name: Definir versão
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $v = $env:INPUT_VERSION.Trim().TrimStart("v")
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $m = Select-String -Path brumare.py -Pattern '^VERSAO\s*=\s*"(.+)"'
            if (-not $m) { throw "VERSAO não encontrada em brumare.py" }
            $v = $m.Matches[0].Groups[1].Value
          }
          if ($v -notmatch '^\d+\.\d+\.\d+([.\-+][0-9A-Za-z.\-]+)?$') {
            throw "Versão inválida: '$v'. Use o formato 1.2.3 (ou 1.2.3-rc1)."
          }

          # Em execução manual, não sobrescreve uma versão que já foi lançada.
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $existe = git ls-remote --tags origin "refs/tags/v$v"
            if ($existe) { throw "A tag v$v já existe. Escolha uma versão nova (ex.: aumente o último número)." }
          }

          $pre = ($v -match '-') -or ($env:INPUT_PRERELEASE -eq "true")

          foreach ($f in "brumare.py", "brumare_gui.py", "brumare_lote.py") {
            if (Test-Path $f) {
              $c = Get-Content $f -Raw -Encoding UTF8
              $n = [regex]::Replace($c, '(?m)^VERSAO\s*=\s*[^\r\n]*', "VERSAO = `"$v`"")
              if ($n -ne $c) {
                [IO.File]::WriteAllText((Resolve-Path $f).Path, $n, (New-Object Text.UTF8Encoding $false))
                Write-Host "VERSAO em $f -> $v"
              }
            }
          }
          "VERSION=$v" >> $env:GITHUB_ENV
          "PRERELEASE=$($pre.ToString().ToLower())" >> $env:GITHUB_ENV
          Write-Host "Versão: $v (pré-release: $pre)"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pillow pywebview pythonnet pyinstaller moyopy imagecodecs

      - name: Interface offline (cópia do site em brumare_app/web)
        run: python tools/montar_app.py

      - name: Foto do autor (Lattes)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          try {
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 -Uri "https://wwws.cnpq.br/cvlattesweb/pkg_util_img.show_foto?v_cod=K4494050P3" -OutFile assets/autor.jpg
            Write-Host "foto ok"
          } catch {
            Write-Host "Foto nao baixada: a interface carrega a foto do Lattes quando houver internet."
          }

      # Metadados do .exe (Propriedades > Detalhes): nome, versão, autor.
      - name: Metadados do executável (version info)
        shell: pwsh
        run: |
          @'
          import os, re
          from PyInstaller.utils.win32.versioninfo import (
              VSVersionInfo, FixedFileInfo, StringFileInfo, StringTable, StringStruct,
              VarFileInfo, VarStruct)

          v = os.environ["VERSION"]
          nums = [int(x) for x in re.findall(r"\d+", v)][:4]
          nums += [0] * (4 - len(nums))
          t = tuple(nums)
          owner = os.environ.get("GITHUB_REPOSITORY_OWNER", "BruMaRe")

          def make(filename, desc):
              return VSVersionInfo(
                  ffi=FixedFileInfo(filevers=t, prodvers=t, mask=0x3F, flags=0x0,
                                    OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
                  kids=[
                      StringFileInfo([StringTable("040904B0", [
                          StringStruct("CompanyName", owner),
                          StringStruct("FileDescription", desc),
                          StringStruct("FileVersion", v),
                          StringStruct("InternalName", "BruMaRe"),
                          StringStruct("OriginalFilename", filename),
                          StringStruct("ProductName", "BruMaRe"),
                          StringStruct("ProductVersion", v),
                          StringStruct("LegalCopyright", "© " + owner),
                      ])]),
                      VarFileInfo([VarStruct("Translation", [1033, 1200])]),
                  ])

          open("version_gui.txt", "w", encoding="utf-8").write(str(make("BruMaRe.exe", "BruMaRe - Interface gráfica")))
          open("version_cli.txt", "w", encoding="utf-8").write(str(make("brumare-cli.exe", "BruMaRe - Linha de comando")))
          print("version info ok:", v)
          '@ | python -

      - name: Executáveis (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name BruMaRe `
            --icon assets\brumare.ico --version-file version_gui.txt `
            --add-data "brumare_app\web;brumare_app\web" --add-data "assets;assets" `
            --collect-all webview --collect-all pythonnet --collect-all clr_loader `
            --collect-all moyopy --collect-all imagecodecs --hidden-import clr `
            --exclude-module scipy --exclude-module pandas --exclude-module IPython `
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 `
            --exclude-module notebook --exclude-module jedi --exclude-module sympy `
            brumare_gui.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller (GUI) falhou" }

          # Atenção: no Windows "BruMaRe.exe" e "brumare.exe" são o MESMO arquivo
          # (nomes não diferenciam maiúsculas). Por isso o CLI se chama brumare-cli.exe.
          python -m PyInstaller --noconfirm --clean --onefile --console --name brumare-cli `
            --icon assets\brumare.ico --version-file version_cli.txt `
            --exclude-module scipy --exclude-module pandas --exclude-module IPython `
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 `
            --exclude-module notebook --exclude-module jedi --exclude-module sympy --exclude-module tkinter `
            --collect-all moyopy --collect-all imagecodecs `
            brumare.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller (CLI) falhou" }

      - name: Teste do executável de linha de comando
        shell: pwsh
        run: |
          # Garante que a interface gráfica não foi sobrescrita pelo CLI.
          $h1 = (Get-FileHash dist\BruMaRe.exe).Hash
          $h2 = (Get-FileHash dist\brumare-cli.exe).Hash
          if ($h1 -eq $h2) { throw "BruMaRe.exe e brumare-cli.exe são idênticos: um sobrescreveu o outro." }

          $out = (& dist\brumare-cli.exe --versao 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "brumare-cli.exe --versao falhou" }
          Write-Host $out
          if ($out -notmatch [regex]::Escape($env:VERSION)) {
            throw "A versão do .exe ('$($out.Trim())') não bate com $env:VERSION"
          }
          & dist\brumare-cli.exe --sobre
          if ($LASTEXITCODE -ne 0) { throw "brumare-cli.exe --sobre falhou" }
          & dist\brumare-cli.exe -h | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "brumare-cli.exe -h falhou" }

      # Abre a interface e confirma que ela não fecha sozinha (erro de DLL, WebView2 etc.).
      - name: Teste de abertura da interface gráfica
        id: gui
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath dist\BruMaRe.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "BruMaRe.exe fechou sozinho (código $($p.ExitCode))" }
          Write-Host "Interface abriu e permaneceu em execução."
          taskkill /F /T /PID $p.Id | Out-Null

      # Só roda se o teste acima falhou: mostra POR QUE a interface fechou.
      # (o .exe sem console esconde as mensagens de erro; aqui geramos uma cópia com console)
      - name: Diagnóstico da interface (só se o teste de abertura falhou)
        if: steps.gui.outcome == 'failure'
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== 1) Erros recentes registrados pelo Windows ==="
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
            Select-Object -First 5 | ForEach-Object { $_.Message; "---" }

          Write-Host "=== 2) Código-fonte rodando direto no Python (20 s) ==="
          $p = Start-Process python -ArgumentList "brumare_gui.py" -PassThru -NoNewWindow `
            -RedirectStandardOutput py_out.txt -RedirectStandardError py_err.txt
          if ($p.WaitForExit(20000)) { Write-Host "Terminou sozinho, código $($p.ExitCode)" }
          else { Write-Host "Ficou aberto por 20 s (ok)"; taskkill /F /T /PID $p.Id | Out-Null }
          Get-Content py_out.txt, py_err.txt -ErrorAction SilentlyContinue

          Write-Host "=== 3) Cópia do .exe COM console, para ver o erro ==="
          python -m PyInstaller --noconfirm --onefile --console --name BruMaRe-debug `
            --distpath dist_debug --workpath build_debug `
            --add-data "brumare_app\web;brumare_app\web" --add-data "assets;assets" `
            --collect-all webview --collect-all pythonnet --collect-all clr_loader `
            --collect-all moyopy --collect-all imagecodecs --hidden-import clr `
            --exclude-module scipy --exclude-module pandas --exclude-module IPython `
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 `
            --exclude-module notebook --exclude-module jedi --exclude-module sympy `
            brumare_gui.py | Out-Null
          $d = Start-Process dist_debug\BruMaRe-debug.exe -PassThru `
            -RedirectStandardOutput dbg_out.txt -RedirectStandardError dbg_err.txt
          if ($d.WaitForExit(20000)) { Write-Host "Terminou sozinho, código $($d.ExitCode)" }
          else { Write-Host "Ficou aberto por 20 s (ok)"; taskkill /F /T /PID $d.Id | Out-Null }
          Get-Content dbg_out.txt, dbg_err.txt -ErrorAction SilentlyContinue

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\brumare.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou" }
          Get-ChildItem dist\BruMaRe-Setup-*.exe | ForEach-Object { Write-Host "Instalador: $($_.Name)" }

      # Instala em silêncio, roda o executável instalado e desinstala.
      - name: Teste do instalador (instalar, executar, desinstalar)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\BruMaRe-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "BruMaReInstall"
          Start-Process -FilePath $setup -Wait `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$dir`""
          Get-Process -Name BruMaRe -ErrorAction SilentlyContinue | Stop-Process -Force

          Write-Host "Conteúdo instalado:"
          Get-ChildItem $dir -Recurse -File | Select-Object -First 30 FullName, Length | Format-Table -AutoSize

          $cli = Get-ChildItem $dir -Recurse -Filter brumare-cli.exe | Select-Object -First 1
          $gui = Get-ChildItem $dir -Recurse -Filter BruMaRe.exe | Select-Object -First 1
          if (-not $gui) { throw "BruMaRe.exe não foi instalado em $dir" }
          if ($cli) {
            & $cli.FullName --versao
            if ($LASTEXITCODE -ne 0) { throw "brumare-cli.exe instalado falhou" }
          } else {
            Write-Host "::warning::brumare-cli.exe não está no instalador (ajuste packaging/windows/brumare.iss se quiser incluí-lo)."
          }

          $unins = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          if ($unins) {
            Start-Process -FilePath $unins.FullName -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
            Write-Host "Desinstalação concluída."
          }

      # Reúne em release/ só os arquivos que vão para a Release, todos com nomes
      # distintos (o GitHub trata nomes de arquivo sem diferenciar maiúsculas).
      - name: Arquivos da Release, pacote portátil (.zip) e checksums
        shell: pwsh
        run: |
          $v = $env:VERSION
          New-Item -ItemType Directory -Force release | Out-Null

          $stage = "stage\BruMaRe-Portable-$v-win64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist\BruMaRe.exe, dist\brumare-cli.exe $stage
          Copy-Item README.md, LICENSE, LICENSE.txt, LICENSE.md $stage -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage\*" -DestinationPath "release\BruMaRe-Portable-$v-win64.zip" -Force

          $setup = Get-ChildItem dist\BruMaRe-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Instalador não encontrado em dist\" }
          Copy-Item $setup.FullName release\
          Copy-Item dist\BruMaRe.exe, dist\brumare-cli.exe release\
          "SETUP_NAME=$($setup.Name)" >> $env:GITHUB_ENV

          $lines = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $lines | Set-Content -Path release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt
          Get-ChildItem release | Format-Table Name, Length

      - name: Texto da Release
        shell: pwsh
        run: |
          $v = $env:VERSION
          $body = @"
          ## BruMaRe $v para Windows

          Baixe, instale e use. Nenhuma instalação de Python é necessária.

          | Arquivo | Para quê |
          |---|---|
          | **$($env:SETUP_NAME)** | Instalador (recomendado): atalhos no Menu Iniciar e desinstalador |
          | **BruMaRe-Portable-$v-win64.zip** | Versão portátil: extraia e execute, sem instalar |
          | BruMaRe.exe | Interface gráfica (igual ao site, funciona offline) |
          | brumare-cli.exe | Linha de comando (``brumare-cli --help``) |
          | SHA256SUMS.txt | Checksums para conferir a integridade dos arquivos |

          ### Requisitos
          - Windows 10 ou 11, 64 bits
          - Microsoft Edge WebView2 Runtime (já vem no Windows 11 e nas versões atualizadas do Windows 10)

          ### Aviso do Windows SmartScreen
          Como o executável ainda não tem assinatura digital paga, o Windows pode mostrar *"O Windows protegeu seu computador"*.
          Clique em **Mais informações** e depois em **Executar assim mesmo**.

          ### Conferir a integridade (opcional)
          ``````powershell
          Get-FileHash .\$($env:SETUP_NAME) -Algorithm SHA256
          ``````
          Compare o resultado com o arquivo ``SHA256SUMS.txt`` desta Release.

          ---
          ### Novidades
          "@
          # remove a indentação do bloco YAML
          $body = ($body -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          Set-Content -Path release_notes.md -Value $body -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: BruMaRe-Windows-${{ env.VERSION }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      # Cria a tag v<versão> (se não existir) e a Release com todos os arquivos.
      # Roda em tag "v*" ou na execução manual com "Publicar" marcado.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: BruMaRe ${{ env.VERSION }}
          body_path: release_notes.md
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.rascunho }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE != 'true' }}
          fail_on_unmatched_files: true
          files: release/*
